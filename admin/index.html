<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Movie Pipeline</title>
    <!-- Permanent Marker carries the hand-painted graffiti lettering. Fails
         soft: joker.css names a system stack after it, so a machine without
         network access gets plain type rather than a broken layout. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
    <script>
      // Runs before first paint: React mounting a moment later would be too
      // late and the page would flash the wrong palette on every load.
      try {
        var t = localStorage.getItem('pipeline-admin-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
